# Cấu hình chính. Giá trị dạng ${TEN_BIEN:mặc định} đọc từ biến môi trường (Render, docker-compose, file .env).
spring:
  application:
    name: fbads
  threads:
    virtual:
      enabled: true            # Java 21: mỗi request / tác vụ chạy trên virtual thread (nhẹ, chờ mạng không tốn luồng thật)
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/fbads}
    username: ${DB_USER:fbads}
    password: ${DB_PASSWORD:fbads}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none           # lược đồ do Flyway quản lý (src/main/resources/db/migration)
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}   # Upstash/Redis có mật khẩu: rediss://default:<mật khẩu>@<host>:6379
  session:
    timeout: 30d
    data:
      redis:
        repository-type: indexed       # cần tìm phiên theo người dùng (đổi mật khẩu → đăng xuất mọi nơi)
        namespace: fbads:session
        configure-action: ${REDIS_CONFIGURE_ACTION:notify-keyspace-events}   # Redis dịch vụ (Upstash…) cấm CONFIG → đặt none
  cache:
    type: redis                        # các cache và thời gian giữ: config/CacheConfig
  kafka:                               # chỉ dùng khi fbads.kafka.enabled=true (KAFKA_ENABLED)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:                          # khoá và nội dung là chuỗi (JSON do app tự viết/đọc, xem event/AppEvent)
      properties:
        max.block.ms: 3000             # Kafka không chạy: mỗi sự kiện chờ tối đa 3 giây rồi bỏ (trên luồng gửi riêng, engine không phải chờ)
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      auto-offset-reset: earliest      # group mới đọc từ đầu topic (không sót sự kiện phát lúc consumer chưa chạy)
    admin:
      fail-fast: true                  # KAFKA_ENABLED=true mà Kafka chưa chạy: dừng khởi động và báo lỗi rõ, không chạy khi chưa có topic
      operation-timeout: 15s

server:
  port: ${PORT:3000}
  forward-headers-strategy: native      # sau proxy (Render): Tomcat đọc X-Forwarded-* (chỉ tin proxy nội bộ) để cookie có cờ Secure
  servlet:
    session:
      timeout: 30d
      cookie:
        name: sid
        http-only: true
        same-site: strict
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

resilience4j:
  retry:
    instances:
      graph:                   # gọi Facebook Graph API: thử lại khi lỗi mạng (không thử lại khi Facebook trả lỗi)
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        enable-exponential-backoff: true
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException

fbads:
  public-dir: ${PUBLIC_DIR:../frontend/dist}   # bản build giao diện Vue (cd frontend && npm run build)
  app-password: ${APP_PASSWORD:}
  public-url: ${PUBLIC_URL:}
  trust-proxy: ${TRUST_PROXY:false}
  render: ${RENDER:false}
  client-ip-header: ${CLIENT_IP_HEADER:}
  engine:
    enabled: ${ENGINE_ENABLED:true}
    tick-ms: 30000
  kafka:
    enabled: ${KAFKA_ENABLED:false}              # chỉ "true" mới bật Kafka; giá trị khác: sự kiện đi bằng Spring events trong ứng dụng
    telegram:
      attempts: 4                                # gửi Telegram: 1 lần + 3 lần thử lại (5 giây, 15 giây, 45 giây) rồi vào DLT
      backoff-ms: 5000
  import:
    file: ${IMPORT_FILE:}                        # đường dẫn data.json của bản Node → nhập 1 lần vào DB
    upstash: ${IMPORT_UPSTASH:false}             # true = nhập từ Upstash (cần UPSTASH_REDIS_REST_URL/TOKEN + DATA_KEY)
    upstash-url: ${UPSTASH_REDIS_REST_URL:}
    upstash-token: ${UPSTASH_REDIS_REST_TOKEN:}
    data-key: ${DATA_KEY:}

logging:
  level:
    root: INFO
    org.hibernate.orm.deprecation: WARN
