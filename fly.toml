# fly.toml app configuration file generated for bongbi on 2026-09-24T08:11:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bongbi'
primary_region = 'sin'

[build]

[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  PORT = '3000'
  TRUST_PROXY = '1'
  TZ = 'Asia/Ho_Chi_Minh'

[[mounts]]
  source = 'fbads_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/auth'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
