# fly.toml app configuration file generated for bongbi on 2026-09-24T08:37:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bongbi'

[build]

[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  PORT = '3000'
  TRUST_PROXY = '1'
  TZ = 'Asia/Ho_Chi_Minh'

[[mounts]]
  source = 'fbads_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '15s', interval = '30s', method = 'GET', path = '/api/auth', timeout = '5s' }]

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
