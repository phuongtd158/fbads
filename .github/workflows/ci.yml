# Chạy kiểm thử backend (Spring Boot) và giao diện (Vue) cho mỗi lần push lên java-spring và mỗi PR vào nhánh này.
# Test backend bật MySQL 8, Redis, Kafka thật qua Testcontainers (runner ubuntu có sẵn Docker).
name: CI

on:
  push:
    branches: [java-spring]
  pull_request:
    branches: [java-spring]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Kiểm thử backend (mvn test)
        run: mvn -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài thư viện
        run: npm ci
        working-directory: frontend
      - name: Kiểm thử (npm test)
        run: npm test
        working-directory: frontend
      - name: Build giao diện
        run: npm run build
        working-directory: frontend
