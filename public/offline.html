<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FB Ads Auto: không có mạng</title>
<style>
  :root { --bg: #f4f5fa; --surface: #fff; --text: #14151f; --text-2: #5b5e73; --border: #e3e5ee; --accent: #5b5bf0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #090a10; --surface: #13141d; --text: #eceef7; --text-2: #a1a4b8; --border: #262837; --accent: #8b8bff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 380px; width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { margin: 0 0 22px; color: var(--text-2); }
  button { border: 0; border-radius: 12px; padding: 11px 22px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bf0'/%3E%3Cpath d='M8 21l6-6 4 4 6-7' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" alt="" /><!-- logo nhúng thẳng: khi mất mạng không tải được file ảnh -->
  <h1>Không có kết nối mạng</h1>
  <p>Điện thoại đang mất mạng hoặc tool chưa chạy. Lịch và rule vẫn chạy trên server, chỉ là chưa xem được ở đây.</p>
  <button type="button" onclick="location.reload()">Thử lại</button>
</main>
<script>addEventListener('online', function () { location.reload() })</script>
</body>
</html>
