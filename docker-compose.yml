# Chạy cả tool (frontend + backend), MariaDB, Redis và Kafka trên máy:  docker compose up --build
# Mở http://localhost:3000. Dữ liệu MariaDB nằm trong volume "db-data" (xoá: docker compose down -v).
# Nhập dữ liệu cũ của bản Node: bỏ dấu # ở 2 dòng IMPORT_FILE / volumes của app (chỉ nhập khi DB còn trống).
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: fbads
      MARIADB_USER: fbads
      MARIADB_PASSWORD: ${DB_PASSWORD:-fbads}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-fbads-root}
      TZ: UTC
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"   # để xem dữ liệu bằng DBeaver/HeidiSQL trên máy; chỉ mở cho máy này
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis: cache số liệu Facebook, phiên đăng nhập, khoá vòng tự động, đẩy sự kiện realtime giữa các instance
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # ghi ra đĩa để khởi động lại không mất phiên đăng nhập
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka (chế độ KRaft, không cần ZooKeeper): sự kiện của tool đi qua topic fbads.events (xem backend/README.md).
  # Hai cổng nghe: kafka:9092 cho app trong Compose, localhost:9094 cho app chạy ngoài Docker (IntelliJ) hoặc công cụ xem topic.
  # Dữ liệu nằm trong container: docker compose down là mất các sự kiện cũ (không sao, dữ liệu thật ở MariaDB).
  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mariadb://db:3306/fbads
      DB_USER: fbads
      DB_PASSWORD: ${DB_PASSWORD:-fbads}
      REDIS_URL: redis://redis:6379
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Trong container tool nghe ở 0.0.0.0 nên bắt buộc có mật khẩu đăng nhập
      APP_PASSWORD: ${APP_PASSWORD:?Hãy đặt APP_PASSWORD, ví dụ APP_PASSWORD=MatKhau@2026 docker compose up}
      # IMPORT_FILE: /import/data.json
    # volumes:
    #   - ./data.json:/import/data.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
