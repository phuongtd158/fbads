# Render Blueprint: tạo web service từ Dockerfile.
#
# Gói Free + lưu dữ liệu ở Upstash Redis (đã mã hoá bằng DATA_KEY). Không tốn tiền, không cần ổ đĩa.
#   Gói Free tự ngủ sau 15 phút không có truy cập → cần dịch vụ ngoài (UptimeRobot…) gọi /api/health mỗi 5 phút để giữ thức
#   (và báo cho bạn khi vòng lịch/rule ngừng: /api/health trả 503).
#   Render sẽ hỏi 4 giá trị bí mật khi tạo: APP_PASSWORD, DATA_KEY, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN.
# Dữ liệu chỉ lưu ở Upstash (không ghi file). Gói trả phí vẫn dùng Upstash: đổi `plan: free` thành gói trả phí.
services:
  - type: web
    name: fbads
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore          # không đổi được sau khi tạo
    plan: free
    branch: dev
    autoDeployTrigger: commit  # push lên nhánh dev thì tự deploy
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0         # Render yêu cầu nghe trên 0.0.0.0 (cổng lấy từ biến PORT do Render đặt)
      - key: TRUST_PROXY
        value: "1"             # lấy IP thật của người dùng từ proxy để giới hạn nhập sai mật khẩu
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: APP_PASSWORD
        sync: false            # Render sẽ hỏi bạn nhập khi tạo; không lưu trong file này
      - key: DATA_KEY
        sync: false            # khoá mã hoá dữ liệu gửi lên Upstash (≥ 16 ký tự). LƯU Ở NƠI KHÁC: mất khoá = không đọc lại được dữ liệu
      - key: UPSTASH_REDIS_REST_URL
        sync: false            # dạng https://xxxx.upstash.io
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
